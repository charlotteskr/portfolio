<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Norkart — Charlotte Skråmestø</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="norkart.css">
</head>
<body>

  <!-- NAV -->
  <nav id="navbar">
    <ul class="nav-links">
      <li><a href="index.html#hjem">hjem</a></li>
      <li><a href="index.html#prosjekter">prosjekter</a></li>
      <li><a href="index.html#kontakt">kontakt</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Meny">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- MOBILE MENU -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html#hjem" class="mobile-link">hjem</a>
    <a href="index.html#prosjekter" class="mobile-link">prosjekter</a>
    <a href="index.html#kontakt" class="mobile-link">kontakt</a>
  </div>

  <!-- HERO -->
  <section class="project-hero">
    <h1 class="project-hero-title">Norkart</h1>
    <p class="project-hero-note">Prosjektside under arbeid — innhold kommer.</p>
  </section>

  <!-- PLACEHOLDER SECTIONS -->
  <section class="project-section">
    <h2 class="project-section-title">Om prosjektet</h2>
    <p class="project-section-body"></p>
  </section>

  <section class="project-section">
    <h2 class="project-section-title">Løsning</h2>
    <p class="project-section-body"></p>
  </section>

  <!-- FOOTER -->
  <footer class="project-footer">
    <a href="index.html" class="footer-back">← tilbake til alle prosjekter</a>
    <span class="footer-copy">Charlotte Skråmestø | 2026</span>
  </footer>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
      document.body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
    });
    document.querySelectorAll('.mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('open');
        mobileMenu.classList.remove('open');
        document.body.style.overflow = '';
      });
    });
  </script>
</body>
</html>
