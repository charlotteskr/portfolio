<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>smArt — Charlotte Skråmestø</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="smart.css">
</head>
<body>

  {% include nav.html %}

  <!-- HERO -->
  <section class="project-hero">
    <h1 class="project-hero-title">smArt</h1>
    <p class="project-hero-note">Prosjektside under arbeid — innhold kommer.</p>
  </section>

  <!-- PLACEHOLDER SECTIONS -->
  <section class="project-section">
    <h2 class="project-section-title">Om prosjektet</h2>
    <p class="project-section-body"></p>
  </section>

  <section class="project-section">
    <h2 class="project-section-title">Løsning</h2>
    <p class="project-section-body"></p>
  </section>

  {% include footer.html project=true %}

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
      document.body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
    });
    document.querySelectorAll('.mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('open');
        mobileMenu.classList.remove('open');
        document.body.style.overflow = '';
      });
    });
  </script>
</body>
</html>
