<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlotte Skråmestø</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAV -->
  <nav id="navbar">
    <ul class="nav-links">
      <li><a href="#hjem">hjem</a></li>
      <li><a href="#prosjekter">prosjekter</a></li>
      <li><a href="#kontakt">kontakt</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Meny">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- MOBILE MENU -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#hjem" class="mobile-link">hjem</a>
    <a href="#prosjekter" class="mobile-link">prosjekter</a>
    <a href="#kontakt" class="mobile-link">kontakt</a>
  </div>

  <!-- MAIN -->
  <main id="hjem">

    <!-- Name -->
    <h1 class="hero-name">charlotte skråmestø</h1>

    <!-- Projects -->
    <div class="projects-list" id="prosjekter">
      <a class="project-item" href="storebrand.html">storebrand</a>
      <a class="project-item" href="ks-kunnskap.html">ks kunnskap</a>
      <a class="project-item" href="mjospromenaden.html">mjøspromenaden</a>
      <a class="project-item" href="smart.html">smArt</a>
      <a class="project-item" href="norkart.html">norkart</a>
    </div>

  </main>

  <!-- Contact -->
  <section class="contact" id="kontakt">
    <a href="mailto:charlotteskramesto@gmail.com" class="contact-link">charlotteskramesto@gmail.com</a>
    <a href="https://www.linkedin.com/in/charlotte-skr%C3%A5mest%C3%B8-290445144/" target="_blank" rel="noopener" class="contact-link">linkedin</a>
  </section>

  <!-- Footer -->
  <footer>
    <span class="footer-copy">Charlotte Skråmestø | 2026</span>
  </footer>

  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
      document.body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
    });
    document.querySelectorAll('.mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('open');
        mobileMenu.classList.remove('open');
        document.body.style.overflow = '';
      });
    });
  </script>
</body>
</html>
